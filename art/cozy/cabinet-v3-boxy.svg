<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <!-- INSERT COIN · "Cozy" skin · art test v1. Original artwork. Part groups use skin part ids; anchors are hidden. -->
  <defs>
    <radialGradient id="crt" cx="45%" cy="40%" r="70%">
      <stop offset="0" stop-color="#FFD1F3"/>
      <stop offset="0.45" stop-color="#FF8FDB"/>
      <stop offset="1" stop-color="#C24BAE"/>
    </radialGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8573C2"/>
      <stop offset="1" stop-color="#6A58A6"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9A8F0"/>
      <stop offset="1" stop-color="#F3A6DA"/>
    </linearGradient>
    <radialGradient id="gold" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.5" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#D98E1F"/>
    </radialGradient>
    <radialGradient id="silver" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#D5D9EA"/>
      <stop offset="1" stop-color="#8E93B3"/>
    </radialGradient>
    <radialGradient id="bronze" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#FFD9B8"/>
      <stop offset="0.5" stop-color="#E0955E"/>
      <stop offset="1" stop-color="#A45A2E"/>
    </radialGradient>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#2C2140"/>
      <stop offset="1" stop-color="#120D1B"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#5A1450" opacity="0.18"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="contact" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="screenClip"><rect x="190" y="254" width="220" height="182" rx="30"/></clipPath>
  </defs>

  <g id="preview-bg">
    <rect width="600" height="900" fill="url(#bgGlow)"/>
  </g>

  <g id="ground-shadow">
    <path d="M118 852 L480 852 L526 814 L164 814 Z" fill="#000" opacity="0.28" filter="url(#softShadow)"/>
    <path d="M146 848 L456 848 L470 840 L160 840 Z" fill="#000" opacity="0.45" filter="url(#contact)"/>
  </g>

  <g id="cable" fill="none" stroke-linecap="round">
    <path d="M506 330 C 566 360, 548 520, 522 640 S 540 820, 568 838" stroke="#231A33" stroke-width="9"/>
    <path d="M506 330 C 566 360, 548 520, 522 640 S 540 820, 568 838" stroke="#3E3257" stroke-width="4"/>
    <rect x="552" y="826" width="34" height="20" rx="6" fill="#3E3257" stroke="#231A33" stroke-width="4"/>
    <rect x="584" y="831" width="10" height="4" rx="1" fill="#231A33"/>
    <rect x="584" y="838" width="10" height="4" rx="1" fill="#231A33"/>
  </g>

  <g id="feet" stroke="#231A33" stroke-width="5" stroke-linejoin="round">
    <path d="M232 822 L246 814 L246 838 L232 846 Z" fill="#231A33"/>
    <path d="M450 822 L464 814 L464 838 L450 846 Z" fill="#231A33"/>
    <rect x="150" y="822" width="82" height="24" rx="3" fill="#2E2542"/>
    <rect x="368" y="822" width="82" height="24" rx="3" fill="#2E2542"/>
  </g>

  <!-- 3/4 view: the right side panel shows depth -->
  <g id="side-panel" stroke="#231A33" stroke-width="5" stroke-linejoin="round">
    <path d="M472 190 L506 170 L506 806 L472 826 Z" fill="#4E3F80"/>
    <path d="M489 190 L489 806" stroke="#6553A0" stroke-width="4" fill="none" opacity="0.7"/>
  </g>

  <g id="body">
    <rect x="128" y="548" width="344" height="278" rx="4" fill="url(#bodyShade)" stroke="#231A33" stroke-width="5" stroke-linejoin="round"/>
    <rect x="142" y="566" width="14" height="240" rx="7" fill="#A796DE" opacity="0.55"/>
    <rect x="130" y="794" width="340" height="30" rx="3" fill="#5B4A91" opacity="0.6"/>
  </g>

  <g id="head">
    <path d="M128 190 L162 170 L506 170 L472 190 Z" fill="#9C8AD6" stroke="#231A33" stroke-width="5" stroke-linejoin="round"/>
    <rect x="128" y="190" width="344" height="340" rx="4" fill="#7B68B5" stroke="#231A33" stroke-width="5" stroke-linejoin="round"/>
    <path d="M146 208 L146 512" stroke="#A796DE" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.6"/>
    <g id="vents" stroke="#4E3F80" stroke-width="6" stroke-linecap="round">
      <path d="M142 318 H158"/><path d="M142 336 H158"/><path d="M142 354 H158"/>
      <path d="M442 318 H458"/><path d="M442 336 H458"/><path d="M442 354 H458"/>
    </g>
  </g>

  <g id="marquee">
    <path d="M160 100 L182 87 L462 87 L440 100 Z" fill="#54466F" stroke="#231A33" stroke-width="5" stroke-linejoin="round"/>
    <path d="M440 100 L462 87 L462 177 L440 190 Z" fill="#2E2542" stroke="#231A33" stroke-width="5" stroke-linejoin="round"/>
    <rect x="160" y="100" width="280" height="90" rx="4" fill="#3E3257" stroke="#231A33" stroke-width="5" stroke-linejoin="round"/>
    <rect x="174" y="112" width="252" height="62" rx="14" fill="url(#sign)" stroke="#231A33" stroke-width="3"/>
    <g id="marquee-doodle">
      <path d="M410 130 a10 10 0 1 0 8 17 a8 8 0 1 1 -8 -17 z" fill="#FFF3C4" stroke="#231A33" stroke-width="2.5"/>
      <path d="M196 124 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1 z" fill="#FFF3C4" stroke="#231A33" stroke-width="2"/>
      <circle cx="222" cy="160" r="3" fill="#FFF3C4"/><circle cx="372" cy="162" r="2.5" fill="#FFF3C4"/>
    </g>
    <text x="300" y="155" text-anchor="middle" font-family="Segoe UI Black, Arial Rounded MT Bold, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" stroke="#8E2F7E" stroke-width="6" paint-order="stroke" letter-spacing="1">INSERT COIN</text>
    <g id="marquee-lights" stroke="#231A33" stroke-width="2">
      <circle cx="190" cy="184" r="4.5" fill="#FFE27A"/><circle cx="214" cy="184" r="4.5" fill="#7A6A9E"/>
      <circle cx="238" cy="184" r="4.5" fill="#FFE27A"/><circle cx="262" cy="184" r="4.5" fill="#7A6A9E"/>
      <circle cx="286" cy="184" r="4.5" fill="#FFE27A"/><circle cx="310" cy="184" r="4.5" fill="#7A6A9E"/>
      <circle cx="334" cy="184" r="4.5" fill="#FFE27A"/><circle cx="358" cy="184" r="4.5" fill="#7A6A9E"/>
      <circle cx="382" cy="184" r="4.5" fill="#FFE27A"/><circle cx="406" cy="184" r="4.5" fill="#7A6A9E"/>
    </g>
  </g>

  <g id="screen">
    <rect x="186" y="250" width="228" height="190" rx="34" fill="#FF7AD9" opacity="0.95" filter="url(#glow)"/>
    <rect x="168" y="234" width="264" height="222" rx="28" fill="#2E2542" stroke="#231A33" stroke-width="5"/>
    <rect x="178" y="244" width="244" height="202" rx="32" fill="#3B2F55"/>
    <rect x="190" y="254" width="220" height="182" rx="30" fill="url(#crt)"/>
    <g clip-path="url(#screenClip)">
      <g id="screen-content" font-family="Consolas, Lucida Console, monospace" font-weight="bold" fill="#6A1C5E">
        <text x="206" y="282" font-size="15" letter-spacing="1">CREDIT 03</text>
        <text x="394" y="282" font-size="15" text-anchor="end">x4</text>
        <path d="M372 270 q4 -8 8 0 q4 -8 8 0 l-8 9 z" fill="#E0457F" transform="translate(-14 0)"/>
        <text x="300" y="352" font-size="58" text-anchor="middle" letter-spacing="2">57:47</text>
        <text x="300" y="376" font-size="12" text-anchor="middle" letter-spacing="3" opacity="0.8">TIME LEFT</text>
        <rect x="218" y="396" width="164" height="12" rx="6" fill="#6A1C5E" opacity="0.25"/>
        <rect x="218" y="396" width="140" height="12" rx="6" fill="#6A1C5E"/>
        <circle cx="236" cy="422" r="2" fill="#6A1C5E"/>
      </g>
      <rect x="190" y="254" width="220" height="182" fill="url(#scan)"/>
      <ellipse cx="248" cy="282" rx="70" ry="30" fill="#FFFFFF" opacity="0.28" transform="rotate(-18 248 282)"/>
    </g>
    <rect x="190" y="254" width="220" height="182" rx="30" fill="none" stroke="#8E2F7E" stroke-width="3" opacity="0.5"/>
  </g>

  <g id="control-panel" stroke="#231A33" stroke-linejoin="round">
    <path d="M452 530 L472 518 L472 548 L452 560 Z" fill="#4E3F80" stroke-width="5"/>
    <path d="M108 530 L128 518 L472 518 L452 530 Z" fill="#B7A7EC" stroke-width="5"/>
    <rect x="108" y="530" width="344" height="30" rx="3" fill="#6A58A6" stroke-width="5"/>
    <path d="M122 537 H438" stroke="#8573C2" stroke-width="3"/>
    <g id="joystick">
      <ellipse cx="190" cy="525" rx="22" ry="8" fill="#3E3257" stroke-width="3"/>
      <rect x="185" y="498" width="10" height="27" rx="4" fill="#3E3257" stroke-width="3"/>
      <circle cx="190" cy="492" r="15" fill="#FF7AC6" stroke-width="4"/>
      <ellipse cx="185" cy="486" rx="5" ry="3.5" fill="#FFFFFF" opacity="0.7" stroke="none"/>
    </g>
    <g id="check-button">
      <ellipse cx="300" cy="526" rx="30" ry="8" fill="#3E3257" stroke-width="3"/>
      <ellipse cx="300" cy="521" rx="25" ry="7" fill="url(#gold)" stroke-width="4"/>
      <path d="M290 521 l7 3 12 -6" fill="none" stroke="#8A5410" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g id="small-buttons" stroke-width="3.5">
      <ellipse cx="362" cy="525" rx="12" ry="4.5" fill="#8EF0D0"/>
      <ellipse cx="394" cy="522" rx="12" ry="4.5" fill="#C6A8FF"/>
      <ellipse cx="426" cy="525" rx="12" ry="4.5" fill="#FF9EC7"/>
    </g>
  </g>

  <g id="coin-door" stroke="#231A33" stroke-linejoin="round">
    <rect x="222" y="590" width="158" height="112" rx="14" fill="#5B4A91" stroke-width="4"/>
    <rect x="232" y="600" width="138" height="92" rx="10" fill="none" stroke="#7E6BC0" stroke-width="3"/>
    <rect x="258" y="614" width="18" height="34" rx="5" fill="#FFB347" stroke-width="3"/>
    <rect x="326" y="614" width="18" height="34" rx="5" fill="#FFB347" stroke-width="3"/>
    <rect x="258" y="614" width="18" height="34" rx="5" fill="#FFB347" opacity="0.8" filter="url(#softGlow)" stroke="none"/>
    <rect x="326" y="614" width="18" height="34" rx="5" fill="#FFB347" opacity="0.8" filter="url(#softGlow)" stroke="none"/>
    <circle cx="267" cy="664" r="4" fill="#231A33" stroke="none"/><circle cx="335" cy="664" r="4" fill="#231A33" stroke="none"/>
    <text x="301" y="684" text-anchor="middle" font-family="Consolas, monospace" font-weight="bold" font-size="11" fill="#C9BCF2" stroke="none" letter-spacing="2">15 MIN</text>
  </g>

  <g id="coin-tray" stroke="#231A33" stroke-linejoin="round">
    <rect x="176" y="726" width="184" height="72" rx="3" fill="#1C1528" stroke-width="5"/>
    <path d="M178 796 L192 787 L358 787 L358 796 Z" fill="#3A2E52" stroke="none"/>
    <path d="M178 728 L192 728 L192 787 L178 796 Z" fill="#2E2542" stroke="none"/>
    <rect x="176" y="726" width="184" height="72" rx="3" fill="none" stroke-width="5"/>
    <g id="coins" stroke-width="3">
      <ellipse cx="218" cy="788" rx="17" ry="6" fill="url(#bronze)"/>
      <ellipse cx="252" cy="790" rx="17" ry="6" fill="url(#silver)"/>
      <ellipse cx="236" cy="781" rx="17" ry="6" fill="url(#gold)"/>
      <ellipse cx="290" cy="789" rx="17" ry="6" fill="url(#gold)"/>
      <g transform="rotate(-24 322 776)">
        <ellipse cx="322" cy="776" rx="17" ry="8" fill="url(#silver)"/>
      </g>
    </g>
    
  </g>

  <g id="printer">
    <rect x="382" y="734" width="58" height="12" rx="4" fill="#231A33"/>
    <g id="iou-ticket" transform="rotate(4 411 744)" stroke="#231A33" stroke-linejoin="round">
      <path d="M390 742 L432 742 L432 806 l-5.25 6 -5.25 -6 -5.25 6 -5.25 -6 -5.25 6 -5.25 -6 -5.25 6 -5.25 -6 Z" fill="#FFF4E6" stroke-width="3"/>
      <text x="411" y="768" text-anchor="middle" font-family="Consolas, monospace" font-weight="bold" font-size="13" fill="#C2185B" stroke="none">IOU</text>
      <text x="411" y="786" text-anchor="middle" font-family="Consolas, monospace" font-weight="bold" font-size="10" fill="#7A4A6E" stroke="none">15m</text>
      <path d="M396 794 H426" stroke="#E0B8C8" stroke-width="2" stroke-dasharray="3 3"/>
    </g>
  </g>

  <g id="stickers" stroke="#231A33" stroke-linejoin="round">
    <g id="sticker-cat" transform="rotate(-8 186 640)">
      <path d="M166 628 l4 -14 10 9 h12 l10 -9 4 14 q4 22 -20 24 q-24 -2 -20 -24 z" fill="#FFFFFF" stroke-width="3"/>
      <circle cx="179" cy="636" r="2.6" fill="#231A33" stroke="none"/><circle cx="197" cy="636" r="2.6" fill="#231A33" stroke="none"/>
      <path d="M184 643 q4 3 8 0" fill="none" stroke-width="2"/>
      <circle cx="174" cy="642" r="3" fill="#FFB3D1" stroke="none"/><circle cx="202" cy="642" r="3" fill="#FFB3D1" stroke="none"/>
    </g>
    <g id="sticker-heart" transform="rotate(10 432 226)">
      <path d="M432 238 l-12 -12 a7 7 0 0 1 12 -8 a7 7 0 0 1 12 8 z" fill="#FF7AB0" stroke-width="3"/>
    </g>
    <g id="sticker-coin" transform="rotate(-6 424 640)">
      <circle cx="424" cy="640" r="15" fill="url(#gold)" stroke-width="3"/>
      <text x="424" y="645" text-anchor="middle" font-family="Segoe UI Black, sans-serif" font-size="14" fill="#8A5410" stroke="none">$</text>
    </g>
  </g>

  <!-- Skin anchors: where the machine attaches animations and physics. Not drawn. -->
  <g id="anchors" display="none">
    <rect id="anchor-screen" x="190" y="254" width="220" height="182"/>
    <rect id="anchor-marquee" x="174" y="112" width="252" height="62"/>
    <rect id="anchor-coin-slot" x="258" y="614" width="18" height="34"/>
    <rect id="anchor-coin-tray" x="184" y="730" width="170" height="64"/>
    <rect id="anchor-printer" x="382" y="734" width="58" height="12"/>
    <rect id="anchor-check-button" x="272" y="506" width="56" height="26"/>
    <rect id="anchor-joystick" x="172" y="472" width="36" height="56"/>
  </g>
</svg>
